name: calliope_fm
description: "Calliope FM — internet radio browser and player."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.5.0

  # Navigation
  go_router: ^14.0.0

  # Audio
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.11
  audio_session: ^0.1.20

  # Networking
  http: ^1.2.0

  # Persistence
  shared_preferences: ^2.3.0

  # Images
  cached_network_image: ^3.3.0

  # Permissions
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/